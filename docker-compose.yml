services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finsight-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://metering_user:metering_password@postgres:5432/metering_billing
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
      INVESTEC_BASE_URL: https://openapisandbox.investec.com
      INVESTEC_API_KEY: ${INVESTEC_API_KEY}
      INVESTEC_CLIENT_ID: ${INVESTEC_CLIENT_ID}
      INVESTEC_CLIENT_SECRET: ${INVESTEC_CLIENT_SECRET}
      MOCK_WEBHOOK_SECRET: ${MOCK_WEBHOOK_SECRET:-change_me}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8001:8000"
    networks:
      - finsight-network

  postgres:
    image: postgres:16
    container_name: finsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metering_billing
      POSTGRES_USER: metering_user
      POSTGRES_PASSWORD: metering_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering_user -d metering_billing"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - finsight-network

networks:
  finsight-network:
    name: finsight-ai_default
    driver: bridge

volumes:
  postgres_data:
    name: finsight-ai_postgres_data

 